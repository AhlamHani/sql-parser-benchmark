[project]
name = "sql-parser-benchmark"
version = "0.1.0"
description = "Comprehensive benchmark comparing Python SQL parsers for table extraction accuracy"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ahlam Hani", email = "ahlam.hani@example.com"}
]
dependencies = [
    "sqlglot==29.0.1",
    "sql-metadata>=2.18.0",
    "sqlparse>=0.5.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parsers", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.uv]
